wrapperVersion=3.3.4
distributionType=only-script
# Pinned on purpose. The build extension Tycho installs into Maven is sensitive
# to the Maven version it lands in, and letting CI use whatever happens to be
# preinstalled on the runner is how a build passes here and fails there.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
