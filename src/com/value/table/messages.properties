warn.noRule=No rule is configured for {0}, so only what can be iterated is shown. Add a rule under Window > Preferences > Java > Debug > ValueTable.
warn.methods.rows=Method columns are skipped: the list has {0} rows and every method cell is a call into the target. Fields are shown. See Preferences > Java > Debug > ValueTable.
warn.methods.failed=Methods could not be listed for this type, so only fields are shown.
warn.columns.limit=Showing the first {0} of {1} members. Raise the column limit under Preferences > Java > Debug > ValueTable.
warn.rows.limit=Showing the first {0} of {1} rows. Raise the row limit under Preferences > Java > Debug > ValueTable.
warn.value.null=The variable has no value. It may be out of scope, or the target VM did not answer.
warn.entity.none=These objects share no field that could be shown, so each one stays a single cell. If their state is behind getters, turn on no-argument methods under Window > Preferences > Java > Debug > ValueTable.
warn.model.error=The table could not be built: {0}
warn.unreadable={0} cells could not be read and are empty. A member may be missing on some rows, or a call was skipped by the guard.
warn.iterator.limit=Stopped after {0} rows; the iterator still had elements. Raise the row limit under Preferences > Java > Debug > ValueTable.
warn.invoke.off=Method calls are disabled, so values are shown without calling toString() or the methods of your rules.
warn.invoke.blocking=Not calling {0}(): it blocks or terminates the debug session.
warn.invoke.blacklisted=Not calling {0}(): it is on your blacklist (Preferences > Java > Debug > ValueTable).
warn.invoke.monitor=Some methods were not called: another suspended thread owns the monitor of the object, so the call would never return. Resume that thread to see those values.

