# User-visible text of the ValueTable plug-in. English is the base bundle.
#
# Read through com.value.table.Messages, never through NLS: the language is
# the user's choice on the preference page, not the platform's -nl switch.
# The _zh_CN file must define exactly the same keys - I18nTest fails the build
# otherwise.
#
# Encoding: UTF-8. Java 9 and newer read .properties as UTF-8, and this bundle
# requires JavaSE-11, so Chinese can be written literally. Do not run it on
# Java 8.
#
# Keys used with Messages.bind() go through java.text.MessageFormat: a lone
# apostrophe in such a value must be written twice (''). Keys read with
# Messages.get() take their text as is, and can also be read with bind() when
# no parameter is passed.
#
# Messages logged to the Error Log stay English in the source: they are for
# whoever debugs the plug-in, not for the user.

