# --- preference page ------------------------------------------------------
pref.description=Rules that tell ValueTable how to read the selected variable as a table. Arrays and classes implementing Iterable or Iterator work without a rule. Click Help to see the syntax.
pref.columns.group=Columns per type (written by the "Columns..." button of a table window)
pref.columns.note=One rule per line: class#member,member() - a name is a field, a name with () is a no-argument method. The line lists every column of the table whose elements have exactly that type, inherited members included: that is what the "Columns..." dialog writes, one line for the element's own type. It does not reach into another type's table - a Person line leaves an Employee table alone, and the other way round. A type with no line of its own is read from every level of its hierarchy, static fields excluded.
pref.columns.example=com.demo.User#name,age,getLevel()int
pref.calls.group=Calls into the debug target
pref.invoke=Call methods on the target: toString() and the methods named in your rules
pref.entityMethods=Also show no-argument methods as columns of an entity table (off: fields only; skipped for lists of more than 200 rows; a per-type rule always wins)
pref.monitorGuard=Skip a call while another suspended thread owns the object's monitor
pref.calls.note=A skipped or slow call only changes how a value is displayed. The guard exists because a JDI call cannot time out: if it waits for a lock that a suspended thread holds, it never returns and the debug session has to be restarted.
pref.blacklist.label=Never call these methods:
pref.blacklist.tip=Comma separated method names, e.g. delete,commit,flush
pref.timeout.label=Warn when a table takes longer than (seconds):
