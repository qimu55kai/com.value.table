# --- 偏好页 ---------------------------------------------------------------
pref.description=告诉 ValueTable 怎么把选中的变量读成一张表。数组、实现了 Iterable 或 Iterator 的类不需要规则。规则语法点“Help”看。
pref.columns.group=按类型的列（由表格窗口的“设置列…”按钮写入）
pref.columns.note=一行一条规则：类名#成员,成员() —— 不带括号的是字段，带 () 的是无参方法。这一行列出“元素类型正好是这个类型”那张表的全部列，父类声明的也算：这就是“设置列…”对话框写出来的东西，每个类型一行。它不影响别的类型的表——Person 那一行不动 Employee 表，反过来也一样。自己没有一行的类型，按整个继承链读取，静态字段不算。
pref.columns.example=com.demo.User#name,age,getLevel()int
pref.calls.group=对目标 JVM 的调用
pref.invoke=允许在目标上调用方法：toString() 以及规则里点名的方法
pref.entityMethods=实体表也把无参方法做成列（关：只显示属性；超过 200 行的列表跳过；按类型的规则优先级更高）
pref.monitorGuard=对象的锁被另一条已挂起线程持有时，跳过这次调用
pref.calls.note=跳过一次调用、或者调用慢一点，只会影响值怎么显示。这个守护是必要的：JDI 调用没有超时，如果它在等一条已挂起线程持有的锁，就永远不会返回，只能重启调试会话。
pref.blacklist.label=永不调用这些方法：
pref.blacklist.tip=用逗号分隔的方法名，例如 delete,commit,flush
pref.timeout.label=一张表超过多少秒给出提示：
pref.maxRows.label=最大行数：
pref.help.tip=点“Help”查看规则语法
pref.help.button=帮助
pref.rule.group=为一个类或接口增加规则
pref.rule.name=类或接口名：
pref.rule.rows=行来自（字段或方法）：
pref.rule.rowLabels=行标签（可空）：
pref.rule.colLabels=列标签（可空）：
pref.add=增加
pref.remove=删除
pref.col.class=类或接口
