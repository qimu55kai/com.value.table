dialog.save.tip=把勾选的成员写成一条规则，记在 {0} 上；只对元素类型是 {0} 的这张表和之后新开的同类表生效
dialog.cancel=取消
dialog.hint=每个 tab 只列这一类自己声明的成员，方便按类查找；保存时并不按 tab 分别记，而是汇成一条规则记在 {0} 上，列的先后就是 tab 的顺序：父类的列在前，{0} 自己的在后。tab 只有 {0} 和它的父类、接口——列表里元素的子类不会列在这里，因为这张表的列不是从子类读的。这条规则只决定元素类型是 {0} 的这张表，其他类型的列表各有自己的一行，改了这里不影响它们。
dialog.empty=当前表格的元素没有可配置的类型（可能是数组或字符串）。
