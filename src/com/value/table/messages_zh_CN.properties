# ValueTable 插件的中文界面文本。
#
# 由 com.value.table.Messages 读取，键必须与 messages.properties 完全一致，
# 缺一个 I18nTest 就会失败。
#
# 编码：UTF-8。Java 9 起 .properties 按 UTF-8 读取，本插件要求 JavaSE-11，
# 所以中文可以直接写，不必做 \uXXXX 转义。
#
# 用 Messages.bind() 读取的键会经 java.text.MessageFormat 处理，值里出现单个
# 英文撇号要写成两个（''）。用 Messages.get() 读取的键按原文返回。
#
# 写进 Error Log 的诊断文字留在源码里用英文：那是给排查插件问题的人看的。

