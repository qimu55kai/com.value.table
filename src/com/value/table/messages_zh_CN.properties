warn.methods.rows=方法列被跳过了：这个列表有 {0} 行，每个方法单元格都是一次对目标的调用。现在只显示属性。详见 Preferences > Java > Debug > ValueTable。
warn.methods.failed=这个类型的方法列不出来，只显示属性。
warn.columns.limit=共 {1} 个成员，只显示前 {0} 个。可在 Preferences > Java > Debug > ValueTable 里提高列数上限。
warn.rows.limit=共 {1} 行，只显示前 {0} 行。可在 Preferences > Java > Debug > ValueTable 里提高行数上限。
warn.value.null=这个变量没有值：可能已不在作用域，或者目标 VM 没有回应。
warn.entity.none=这些对象没有共同的字段可以显示，于是每个对象占一格。如果它们的状态在 getter 后面，可以在 Window > Preferences > Java > Debug > ValueTable 里打开无参方法。
warn.model.error=表格没能建起来：{0}
warn.unreadable={0} 个单元格读不出来，显示为空。可能是某些行缺这个成员，或者调用被守护跳过了。
warn.iterator.limit=读到 {0} 行就停了，迭代器里还有元素。可在 Preferences > Java > Debug > ValueTable 里提高行数上限。
warn.invoke.off=方法调用是关闭的，所以显示值时不会调用 toString() 和规则里的方法。
warn.invoke.blocking=不调用 {0}()：它会阻塞或结束调试会话。
warn.invoke.blacklisted=不调用 {0}()：它在你的黑名单里（Preferences > Java > Debug > ValueTable）。
warn.invoke.monitor=有些方法没有调用：对象的锁被另一条已挂起线程持有，调用不会返回。恢复那条线程就能看到这些值。

