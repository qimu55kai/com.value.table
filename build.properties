source.. = src/
output.. = bin/

# Explicit, because "." does not carry the resource files here: a p2 build
# produced a jar with plugin.xml and icons/ but without plugin.properties,
# help.txt or help_zh_CN.txt. Bundle-Localization: plugin then had nothing to
# read, and every menu entry would have shown its %key instead of a label.
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               plugin.properties,\
               help.txt,\
               help_zh_CN.txt,\
               icons/
