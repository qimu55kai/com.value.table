# Text the platform reads out of plugin.xml.
#
# These are not read by our own code: the extension registry resolves every
# %key in plugin.xml against this file, using Bundle-Localization in the
# manifest. Command names, menu labels and tooltips live here.
#
# Deliberately English only - no plugin_<locale>.properties next to it.
# The registry picks a translation with the platform-wide -nl locale, which is
# not the language chosen on this plug-in's own preference page. Translating
# here therefore produced a Chinese menu entry in front of an English table
# window (or the other way round), depending on two unrelated settings. The
# context menu and the toolbar button are the way into the window, not part of
# it, so they stay in the IDE's own language-neutral English and the window
# alone follows the preference.
#
# Everything the window itself shows is in messages.properties, which has a
# _zh_CN next to it and is read through com.value.table.Messages.
#
# This file must stay ISO-8859-1: Properties.load reads bytes, not UTF-8.
command.showAsTable.name=Show as Table
command.showAsTable.description=Show the selected debug variable or watch expression as a table
command.showAsTable.tooltip=Show the selected variable as a table
command.showAsTable.tooltip.expression=Show the value of the selected expression as a table
