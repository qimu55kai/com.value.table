# Chinese text for plugin.xml - the command and menu labels.
#
# Read by the extension registry through Bundle-Localization, not by Messages.
# Properties.load() decodes bytes as ISO-8859-1, so non-Latin text has to be
# written as \uXXXX escapes here; literal UTF-8 would come out as mojibake,
# and only in the menus, which is the quietest possible place to be wrong.
#
# Generate with native2ascii (or any script) from plugin.properties. The key
# set must match plugin.properties exactly - I18nTest compares them.

